openapi: 3.1.0
info:
  title: Proof Fabric Protocol (PFP)
  description: Cryptographically verifiable Proof Artifacts — general-purpose proof
    infrastructure & enterprise control plane.
  version: 2.0.0
paths:
  /api/fea/generate:
    post:
      tags:
      - FEA
      summary: Generate Fea Endpoint
      description: Generate a Proof Artifact (tenant-bound, dual-layer replay protection).
      operationId: generate_fea_endpoint_api_fea_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFEARequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEAResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/fea/batch:
    post:
      tags:
      - FEA
      summary: Batch Generate Fea
      description: 'Generate up to 500 Proof Artifacts in a single call. Each item
        is processed

        independently; partial failures are reported per-item.'
      operationId: batch_generate_fea_api_fea_batch_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGenerateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGenerateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/fea/verify:
    post:
      tags:
      - FEA
      summary: Verify Fea Endpoint
      description: Verify a Proof Artifact payload and signature.
      operationId: verify_fea_endpoint_api_fea_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyFEARequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyFEAResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/fea:
    get:
      tags:
      - FEA
      summary: List Feas
      description: List the authenticated tenant's Proof Artifacts (paginated).
      operationId: list_feas_api_fea_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEAListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/fea/{fea_id}:
    get:
      tags:
      - FEA
      summary: Get Fea
      description: Authenticated single Proof Artifact fetch (tenant scoped).
      operationId: get_fea_api_fea__fea_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: fea_id
        in: path
        required: true
        schema:
          type: string
          title: Fea Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FEAResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/public/verify/{fea_id}:
    get:
      tags:
      - Public
      summary: Public Verify Fea
      description: 'Public verification of a Proof Artifact by ID.

        No authentication required.'
      operationId: public_verify_fea_api_public_verify__fea_id__get
      parameters:
      - name: fea_id
        in: path
        required: true
        schema:
          type: string
          title: Fea Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/public/keys:
    get:
      tags:
      - Public
      summary: Get Key Registry
      description: 'Get all public keys in the registry.

        No authentication required.


        Returns both active and retired keys to support

        verification of historical Proof Artifacts.'
      operationId: get_key_registry_api_public_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyRegistryResponse'
  /api/demo/sandbox-key:
    post:
      tags:
      - Demo
      summary: Issue Sandbox Key
      description: 'Issue a real, scoped, short-lived sandbox API key for the Developer
        Portal.


        The key is a genuine DB-backed credential (only its SHA-256 hash is stored)

        bound to the isolated `sandbox` tenant with data-plane scopes

        (fea:write / fea:read / fea:verify) and a 1-day expiry. It can immediately

        sign and verify Proof Artifacts through the live API.'
      operationId: issue_sandbox_key_api_demo_sandbox_key_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxKeyResponse'
  /api/demo/proof:
    post:
      tags:
      - Demo
      summary: Generate Party Proof
      description: "Generate a deterministic proof for a party record.\n\nSteps:\n\
        \  1. Normalize fields (trim, casing, amount format, timestamp format)\n \
        \ 2. Canonicalize to a deterministic JSON string (sorted keys)\n  3. SHA-256\
        \ hash the canonical JSON\n\nTwo parties applying these same steps to logically-identical\
        \ records\nwill produce identical `proof_hash` values — enabling proof-based\n\
        consistency comparison without exposing raw data."
      operationId: generate_party_proof_api_demo_proof_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyRecord'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/demo/issue:
    post:
      tags:
      - Demo
      summary: Issue Proof
      description: 'Issue a compliance-aware proof for a transaction and persist it
        so it can

        be verified later by an auditor using only the Proof ID.'
      operationId: issue_proof_api_demo_issue_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/demo/verify/{proof_id}:
    get:
      tags:
      - Demo
      summary: Verify Proof By Id
      description: 'Look up a stored proof and re-verify its integrity by re-canonicalizing

        and re-hashing the persisted payload. Returns the compliance state that

        was embedded when the proof was issued.'
      operationId: verify_proof_by_id_api_demo_verify__proof_id__get
      parameters:
      - name: proof_id
        in: path
        required: true
        schema:
          type: string
          title: Proof Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyByIdResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/demo/artifact:
    post:
      tags:
      - Demo
      summary: Build Downloadable Artifact
      description: "Build and sign a standalone proof artifact that can be downloaded,\n\
        shared, and independently verified anywhere.\n\nResponse:\n  - Body: canonical\
        \ JSON of the signed artifact\n  - Content-Type: application/pfp-proof+json;v=1\n\
        \  - Content-Disposition: attachment (suggested filename with proof_id)"
      operationId: build_downloadable_artifact_api_demo_artifact_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/demo/artifact/verify:
    post:
      tags:
      - Demo
      summary: Verify Downloadable Artifact
      description: 'Independently verify an uploaded/pasted signed proof artifact.


        Runs strict schema checks, canonical-ordering enforcement, normalization,

        timestamp skew, constant-time proof_id comparison, kid lookup (including

        revocation), and Ed25519 signature verification.'
      operationId: verify_downloadable_artifact_api_demo_artifact_verify_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Artifact
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactVerifyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh Token
      operationId: refresh_token_api_auth_refresh_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/admin/api-keys/create:
    post:
      tags:
      - Admin
      summary: Create Api Key
      operationId: create_api_key_api_admin_api_keys_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/admin/api-keys:
    get:
      tags:
      - Admin
      summary: List Api Keys
      operationId: list_api_keys_api_admin_api_keys_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/api-keys/revoke:
    post:
      tags:
      - Admin
      summary: Revoke Api Key
      operationId: revoke_api_key_api_admin_api_keys_revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: key_id
        in: query
        required: true
        schema:
          type: string
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/keys/create:
    post:
      tags:
      - Admin
      summary: Create Signing Key
      description: Register an externally-generated public key in the registry.
      operationId: create_signing_key_api_admin_keys_create_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/admin/keys/rotate:
    post:
      tags:
      - Admin
      summary: Rotate Signing Key
      description: 'Generate a new keypair, register its public key as active, retire
        the

        previous active key(s). Returns the new private seed ONCE — the operator

        must deploy it to the KMS/secret store and restart for new issuance to use
        it.'
      operationId: rotate_signing_key_api_admin_keys_rotate_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/admin/keys/revoke:
    post:
      tags:
      - Admin
      summary: Revoke Signing Key
      operationId: revoke_signing_key_api_admin_keys_revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: public_key_id
        in: query
        required: true
        schema:
          type: string
          title: Public Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/keys/retire:
    post:
      tags:
      - Admin
      summary: Retire Signing Key
      operationId: retire_signing_key_api_admin_keys_retire_post
      security:
      - HTTPBearer: []
      parameters:
      - name: public_key_id
        in: query
        required: true
        schema:
          type: string
          title: Public Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/keys/federated/register:
    post:
      tags:
      - Admin
      summary: Register Federated Key
      description: 'Register a customer/partner-owned public key (raw / JWK / SPKI
        PEM).


        Returns a single-use proof-of-possession challenge; the key stays `pending`

        until /keys/federated/confirm proves control of the private key.'
      operationId: register_federated_key_api_admin_keys_federated_register_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedKeyRegisterRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederatedKeyRegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/keys/federated/confirm:
    post:
      tags:
      - Admin
      summary: Confirm Federated Key
      description: Confirm proof-of-possession and activate a pending federated key.
      operationId: confirm_federated_key_api_admin_keys_federated_confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederatedKeyConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/signers:
    post:
      tags:
      - Admin
      summary: Configure Signer
      description: Configure the signer for a tenant (BYOS). Registers the signer's
        public key.
      operationId: configure_signer_api_admin_signers_post
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignerConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Admin
      summary: List Signers
      operationId: list_signers_api_admin_signers_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Admin
      summary: Delete Signer
      operationId: delete_signer_api_admin_signers_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/signers/health:
    get:
      tags:
      - Admin
      summary: Signers Health
      operationId: signers_health_api_admin_signers_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/admin/tenants:
    get:
      tags:
      - Admin
      summary: List Tenants
      operationId: list_tenants_api_admin_tenants_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - Admin
      summary: Create Tenant
      operationId: create_tenant_api_admin_tenants_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/admin/audit:
    get:
      tags:
      - Admin
      summary: Get Audit
      operationId: get_audit_api_admin_audit_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/audit/verify:
    get:
      tags:
      - Admin
      summary: Verify Audit
      description: Verify the integrity of the audit hash chain.
      operationId: verify_audit_api_admin_audit_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/webhooks/subscribe:
    post:
      tags:
      - Webhooks
      summary: Subscribe
      operationId: subscribe_api_webhooks_subscribe_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /api/webhooks:
    get:
      tags:
      - Webhooks
      summary: List Subscriptions
      operationId: list_subscriptions_api_webhooks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /api/webhooks/test:
    post:
      tags:
      - Webhooks
      summary: Test Webhook
      operationId: test_webhook_api_webhooks_test_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: webhook_id
        in: query
        required: true
        schema:
          type: string
          title: Webhook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/webhooks/{webhook_id}:
    delete:
      tags:
      - Webhooks
      summary: Delete Webhook
      operationId: delete_webhook_api_webhooks__webhook_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
          title: Webhook Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/:
    get:
      summary: Root
      operationId: root_api__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/health:
    get:
      summary: Health Check
      description: 'Deep health check: validates DB, key registry, and signing service.'
      operationId: health_check_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/metrics:
    get:
      summary: Metrics
      description: Prometheus metrics endpoint.
      operationId: metrics_api_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/config:
    get:
      summary: Get Config
      description: 'Public configuration.


        The sandbox API key is exposed ONLY outside production (dev/sandbox) for the

        developer console. In production, no key is returned — keys are provisioned

        via the admin control plane (POST /api/admin/api-keys/create).'
      operationId: get_config_api_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/developer:
    get:
      summary: Developer Resources
      description: 'Developer resource index — Swagger, OpenAPI, Postman, docs, and
        SDKs.


        URLs are built from the request''s own base URL, so this works identically
        on

        any attached domain (demo.pfprotocol.com or api.pfprotocol.com).'
      operationId: developer_resources_api_developer_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ArtifactRequest:
      properties:
        transaction_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Transaction Id
        user_id:
          type: string
          maxLength: 200
          minLength: 1
          title: User Id
        amount:
          anyOf:
          - type: string
          - type: number
          - type: integer
          title: Amount
        compliance:
          $ref: '#/components/schemas/ComplianceResult'
        timestamp:
          anyOf:
          - type: string
          - type: 'null'
          title: Timestamp
      type: object
      required:
      - transaction_id
      - user_id
      - amount
      - compliance
      title: ArtifactRequest
    ArtifactVerifyResult:
      properties:
        valid:
          type: boolean
          title: Valid
        status:
          type: string
          title: Status
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        extracted:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extracted
      type: object
      required:
      - valid
      - status
      title: ArtifactVerifyResult
    BatchGenerateRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GenerateFEARequest'
          type: array
          maxItems: 500
          minItems: 1
          title: Items
      type: object
      required:
      - items
      title: BatchGenerateRequest
    BatchGenerateResponse:
      properties:
        total:
          type: integer
          title: Total
        succeeded:
          type: integer
          title: Succeeded
        failed:
          type: integer
          title: Failed
        results:
          items:
            $ref: '#/components/schemas/BatchItemResult'
          type: array
          title: Results
      type: object
      required:
      - total
      - succeeded
      - failed
      - results
      title: BatchGenerateResponse
    BatchItemResult:
      properties:
        index:
          type: integer
          title: Index
        success:
          type: boolean
          title: Success
        fea_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Fea Id
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - index
      - success
      title: BatchItemResult
    ComplianceResult:
      properties:
        kyc:
          type: string
          pattern: ^(Pass|Fail)$
          title: Kyc
        aml:
          type: string
          pattern: ^(Pass|Fail)$
          title: Aml
        limits:
          type: string
          pattern: ^(Within allowed range|Exceeded)$
          title: Limits
        status:
          type: string
          pattern: ^(COMPLIANT|NON-COMPLIANT)$
          title: Status
      type: object
      required:
      - kyc
      - aml
      - limits
      - status
      title: ComplianceResult
    CreateApiKeyRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        customer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Id
        scopes:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Scopes
        expires_in_days:
          anyOf:
          - type: integer
            maximum: 3650.0
            minimum: 1.0
          - type: 'null'
          title: Expires In Days
      type: object
      required:
      - name
      title: CreateApiKeyRequest
    CreateApiKeyResponse:
      properties:
        key_id:
          type: string
          title: Key Id
        api_key:
          type: string
          title: Api Key
        name:
          type: string
          title: Name
        tenant_id:
          type: string
          title: Tenant Id
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
      type: object
      required:
      - key_id
      - api_key
      - name
      - tenant_id
      - scopes
      title: CreateApiKeyResponse
    CreateKeyRequest:
      properties:
        public_key_b64:
          type: string
          minLength: 10
          title: Public Key B64
        public_key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Key Id
      type: object
      required:
      - public_key_b64
      title: CreateKeyRequest
    CreateTenantRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
      type: object
      required:
      - name
      title: CreateTenantRequest
    CustomField:
      properties:
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        value:
          type: string
          maxLength: 2000
          minLength: 1
          title: Value
      type: object
      required:
      - label
      - value
      title: CustomField
      description: 'A single user-defined workflow field (label/value pair).


        Used by the Generic Workflow Builder. Embedded in the canonical payload as

        an ORDERED list so the exact field order shown on screen is preserved and

        cryptographically proven.'
    FEAListItem:
      properties:
        fea_id:
          type: string
          title: Fea Id
        transaction_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Id
        created_at:
          type: string
          title: Created At
        public_key_id:
          type: string
          title: Public Key Id
      type: object
      required:
      - fea_id
      - created_at
      - public_key_id
      title: FEAListItem
    FEAListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/FEAListItem'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        skip:
          type: integer
          title: Skip
      type: object
      required:
      - items
      - total
      - limit
      - skip
      title: FEAListResponse
    FEAResponse:
      properties:
        fea_id:
          type: string
          title: Fea Id
        fea_payload:
          additionalProperties: true
          type: object
          title: Fea Payload
        signature:
          type: string
          title: Signature
        signature_version:
          type: string
          title: Signature Version
          default: v2
        public_key_id:
          type: string
          title: Public Key Id
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - fea_payload
      - signature
      - public_key_id
      title: FEAResponse
      description: 'Response from Proof Artifact generation.


        Structure separates:

        - fea_payload: the signed data

        - signature: cryptographic signature

        - signature_version: signature metadata (NOT signed)

        - created_at: response metadata (NOT signed)'
    FederatedKeyConfirmRequest:
      properties:
        public_key_id:
          type: string
          title: Public Key Id
        pop_signature:
          type: string
          title: Pop Signature
          description: 'Base64 signature over (PFP_POP_V1:: + challenge)'
      type: object
      required:
      - public_key_id
      - pop_signature
      title: FederatedKeyConfirmRequest
    FederatedKeyRegisterRequest:
      properties:
        algorithm:
          type: string
          title: Algorithm
          description: Ed25519 | ES256 | ES256K
        key_format:
          type: string
          title: Key Format
          description: raw | jwk | spki-pem
          default: raw
        public_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Key
          description: Base64 raw key OR base64 SPKI PEM, per key_format
        jwk:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Jwk
          description: JWK object (when key_format=jwk)
        owner:
          type: string
          title: Owner
          description: customer | partner
          default: partner
        label:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Label
        not_before:
          anyOf:
          - type: string
          - type: 'null'
          title: Not Before
        not_after:
          anyOf:
          - type: string
          - type: 'null'
          title: Not After
      type: object
      required:
      - algorithm
      title: FederatedKeyRegisterRequest
      description: Register a customer/partner-owned public key (starts in `pending`).
    FederatedKeyRegisterResponse:
      properties:
        public_key_id:
          type: string
          title: Public Key Id
        tenant_id:
          type: string
          title: Tenant Id
        algorithm:
          type: string
          title: Algorithm
        status:
          type: string
          title: Status
        pop_challenge:
          type: string
          title: Pop Challenge
          description: Sign this (with domain prefix PFP_POP_V1::) using the private
            key, then call /confirm
        pop_domain_prefix:
          type: string
          title: Pop Domain Prefix
          default: 'PFP_POP_V1::'
        expires_at:
          type: string
          title: Expires At
      type: object
      required:
      - public_key_id
      - tenant_id
      - algorithm
      - status
      - pop_challenge
      - expires_at
      title: FederatedKeyRegisterResponse
    GenerateFEARequest:
      properties:
        idempotency_key:
          type: string
          minLength: 1
          title: Idempotency Key
        transaction_id:
          type: string
          minLength: 1
          title: Transaction Id
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 UTC timestamp
        amount:
          type: integer
          minimum: 0.0
          title: Amount
          description: Amount/quantity in smallest unit (e.g., cents)
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        payer_id:
          type: string
          title: Payer Id
          description: Hashed/tokenized payer identifier
        payee_id:
          type: string
          title: Payee Id
          description: Hashed/tokenized payee identifier
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        signature_suite:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature Suite
          description: 'Signature suite: Ed25519 (default) | ES256 (secp256r1) | ES256K
            (secp256k1). Requires the crypto-agility feature to be enabled.'
      type: object
      required:
      - idempotency_key
      - transaction_id
      - timestamp
      - amount
      - currency
      - payer_id
      - payee_id
      title: GenerateFEARequest
      description: Input for Proof Artifact generation - POST /api/fea/generate.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IndustryCheck:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        desc:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Desc
        status:
          type: string
          pattern: ^(Pass|Fail)$
          title: Status
      type: object
      required:
      - name
      - status
      title: IndustryCheck
      description: A single industry-specific compliance check executed before proof
        issuance.
    IndustryContext:
      properties:
        id:
          type: string
          maxLength: 50
          minLength: 1
          title: Id
        label:
          type: string
          maxLength: 100
          minLength: 1
          title: Label
        checks:
          items:
            $ref: '#/components/schemas/IndustryCheck'
          type: array
          maxItems: 50
          minItems: 1
          title: Checks
        context:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Context
        custom_fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
            maxItems: 50
          - type: 'null'
          title: Custom Fields
      type: object
      required:
      - id
      - label
      - checks
      title: IndustryContext
      description: 'Optional industry-aware metadata describing which checks were
        executed.


        When present, this object is embedded in the canonical payload so the

        exact list of industry-specific checks (and their outcomes) is

        cryptographically proven by the issued proof_id. The cryptographic

        primitives (canonicalize → SHA-256 → Ed25519) are unchanged; only the

        input dict gains an additional, well-defined field.


        `context` carries optional, industry-specific descriptive metadata

        (e.g. Release Name / Environment for Change & Release Management). It is

        embedded in the signed payload too, so it is proven and returned on verify

        without exposing any raw operational data.'
    IssueRequest:
      properties:
        transaction_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Transaction Id
        user_id:
          type: string
          maxLength: 200
          minLength: 1
          title: User Id
        amount:
          anyOf:
          - type: string
          - type: number
          - type: integer
          title: Amount
        created_at:
          type: string
          minLength: 1
          title: Created At
        compliance:
          $ref: '#/components/schemas/ComplianceResult'
        industry:
          anyOf:
          - $ref: '#/components/schemas/IndustryContext'
          - type: 'null'
      type: object
      required:
      - transaction_id
      - user_id
      - amount
      - created_at
      - compliance
      title: IssueRequest
    IssueResponse:
      properties:
        proof_id:
          type: string
          title: Proof Id
        proof_hash:
          type: string
          title: Proof Hash
        transaction_id:
          type: string
          title: Transaction Id
        issued_at:
          type: string
          title: Issued At
        metadata:
          $ref: '#/components/schemas/ProofMetadata'
      type: object
      required:
      - proof_id
      - proof_hash
      - transaction_id
      - issued_at
      - metadata
      title: IssueResponse
    KeyRegistryResponse:
      properties:
        keys:
          items:
            $ref: '#/components/schemas/PublicKeyInfo'
          type: array
          title: Keys
        total:
          type: integer
          title: Total
          default: 0
        active_count:
          type: integer
          title: Active Count
          default: 0
        retired_count:
          type: integer
          title: Retired Count
          default: 0
      type: object
      required:
      - keys
      title: KeyRegistryResponse
      description: Response from key registry endpoint.
    LoginRequest:
      properties:
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginRequest
    PartyRecord:
      properties:
        transaction_id:
          type: string
          maxLength: 200
          minLength: 1
          title: Transaction Id
        user_id:
          type: string
          maxLength: 200
          minLength: 1
          title: User Id
        amount:
          anyOf:
          - type: string
          - type: number
          - type: integer
          title: Amount
        created_at:
          type: string
          minLength: 1
          title: Created At
      type: object
      required:
      - transaction_id
      - user_id
      - amount
      - created_at
      title: PartyRecord
    ProofMetadata:
      properties:
        algorithm:
          type: string
          title: Algorithm
        canonicalization:
          type: string
          title: Canonicalization
        generated_at:
          type: string
          title: Generated At
      type: object
      required:
      - algorithm
      - canonicalization
      - generated_at
      title: ProofMetadata
    ProofResponse:
      properties:
        proof_hash:
          type: string
          title: Proof Hash
        normalized_payload:
          additionalProperties: true
          type: object
          title: Normalized Payload
        metadata:
          $ref: '#/components/schemas/ProofMetadata'
      type: object
      required:
      - proof_hash
      - normalized_payload
      - metadata
      title: ProofResponse
    PublicKeyInfo:
      properties:
        public_key_id:
          type: string
          title: Public Key Id
        public_key:
          type: string
          title: Public Key
        algorithm:
          type: string
          title: Algorithm
          default: Ed25519
        created_at:
          type: string
          title: Created At
        status:
          type: string
          enum:
          - active
          - retired
          - revoked
          - pending
          title: Status
          default: active
        key_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Format
        jwk:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Jwk
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        not_before:
          anyOf:
          - type: string
          - type: 'null'
          title: Not Before
        not_after:
          anyOf:
          - type: string
          - type: 'null'
          title: Not After
        pop_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pop Verified
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      type: object
      required:
      - public_key_id
      - public_key
      - created_at
      title: PublicKeyInfo
      description: Public key information for verification.
    PublicVerifyResponse:
      properties:
        fea_id:
          type: string
          title: Fea Id
        fea_payload:
          additionalProperties: true
          type: object
          title: Fea Payload
        signature:
          type: string
          title: Signature
        signature_version:
          type: string
          title: Signature Version
        signature_valid:
          type: boolean
          title: Signature Valid
        issuer_id:
          type: string
          title: Issuer Id
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - fea_id
      - fea_payload
      - signature
      - signature_version
      - signature_valid
      - issuer_id
      - created_at
      title: PublicVerifyResponse
      description: Response from public verification - GET /public/verify/{fea_id}.
    SandboxKeyResponse:
      properties:
        api_key:
          type: string
          title: Api Key
        key_id:
          type: string
          title: Key Id
        tenant_id:
          type: string
          title: Tenant Id
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        environment:
          type: string
          title: Environment
          default: sandbox
        note:
          type: string
          title: Note
          default: Sandbox key for evaluation only. Scoped to the sandbox tenant,
            rate-limited and short-lived. Do not use in production.
      type: object
      required:
      - api_key
      - key_id
      - tenant_id
      - scopes
      title: SandboxKeyResponse
    SignerConfigRequest:
      properties:
        type:
          type: string
          title: Type
          description: local | remote | cloud-kms
        algorithm:
          type: string
          title: Algorithm
          description: Ed25519 | ES256 | ES256K
          default: Ed25519
        endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Endpoint
        auth_header:
          anyOf:
          - type: string
          - type: 'null'
          title: Auth Header
        timeout:
          anyOf:
          - type: number
          - type: 'null'
          title: Timeout
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        key_ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Ref
        public_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Key
        logical:
          anyOf:
          - type: string
          - type: 'null'
          title: Logical
      type: object
      required:
      - type
      title: SignerConfigRequest
    SubscribeRequest:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
        events:
          items:
            type: string
          type: array
          title: Events
      type: object
      required:
      - url
      title: SubscribeRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        role:
          type: string
          title: Role
        tenant_id:
          type: string
          title: Tenant Id
        email:
          type: string
          title: Email
      type: object
      required:
      - access_token
      - refresh_token
      - role
      - tenant_id
      - email
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerifyByIdResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        proof_id:
          type: string
          title: Proof Id
        transaction_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Id
        compliance:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Compliance
        industry:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Industry
        issued_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Issued At
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - valid
      - proof_id
      title: VerifyByIdResponse
    VerifyFEARequest:
      properties:
        fea_payload:
          additionalProperties: true
          type: object
          title: Fea Payload
        signature:
          type: string
          title: Signature
        signature_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature Version
      type: object
      required:
      - fea_payload
      - signature
      title: VerifyFEARequest
      description: 'Input for Proof Artifact verification - POST /api/fea/verify.


        Supports both:

        - New format: fea_payload + signature + signature_version (external)

        - Legacy format: fea_payload with signature_version inside + signature'
    VerifyFEAResponse:
      properties:
        valid:
          type: boolean
          title: Valid
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
