replicaCount: 3

image:
  repository: ghcr.io/pfprotocol/pfp-backend
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8001

ingress:
  enabled: true
  className: nginx
  host: api.pfprotocol.com
  tlsSecret: pfp-tls

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 512Mi }

# Non-secret config -> ConfigMap
config:
  ENVIRONMENT: production
  DB_NAME: pfp_prod
  KMS_PROVIDER: aws
  ISSUER_ID: pfp-issuer-001
  CORS_ORIGINS: https://pfprotocol.com,https://demo.pfprotocol.com,https://api.pfprotocol.com
  ACCEPT_LEGACY_V1: "false"
  ENFORCE_VERIFY_TIMESTAMP: "true"
  MAX_REQUEST_BYTES: "1048576"
  DEFAULT_TENANT_ID: default

# Secret values are provided out-of-band (existingSecret) — never inline in prod.
existingSecret: pfp-secrets
