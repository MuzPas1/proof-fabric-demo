apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfp-backend
  labels: { app: pfp-backend }
spec:
  replicas: 3
  selector:
    matchLabels: { app: pfp-backend }
  template:
    metadata:
      labels: { app: pfp-backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: pfp-backend
          image: ghcr.io/pfprotocol/pfp-backend:2.0.0
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef: { name: pfp-secrets }
            - configMapRef: { name: pfp-config }
          readinessProbe:
            httpGet: { path: /api/health, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/health, port: 8001 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: pfp-backend
spec:
  selector: { app: pfp-backend }
  ports:
    - port: 80
      targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pfp-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pfp-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pfp-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.pfprotocol.com]
      secretName: pfp-tls
  rules:
    - host: api.pfprotocol.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pfp-backend
                port: { number: 80 }
