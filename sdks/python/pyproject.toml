[project]
name = "pfp-sdk"
version = "2.0.0"
description = "Proof Fabric Protocol (PFP) Python SDK — client + independent verification"
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0", "PyNaCl>=1.5.0"]

[project.urls]
Homepage = "https://pfprotocol.com"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pfp_sdk*"]
